selectors:
  - name: mantenimiento_noaa
    description: 'fct_weather_daily actualiza desde los ultimos 7 dias de registro. Hacer dbt build --full-refresh'
    definition:
      union:
        - method: fqn
          value: fct_weather_daily
          parents: true
        - method: fqn
          value: fct_trips_weather
        - exclude:
            - method: test_type
              value: unit
  
  - name: dbt-build
    description: 'Uso para PRO ya que no es necesario los unit test'
    definition:
      union:
        - method: path
          value: models
        - exclude: 
          - method: test_type
            value: unit

  - name: demo
    description: 'Uso para demo, menos de 1000 rides, el test falla y rompe el dbt build'
    definition:
      union:
        - method: path
          value: models
        - exclude: 
          - method: fqn
            value: test_citybike_partial_month_detection

  
