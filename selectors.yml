selectors:
  - name: mantenimiento_noaa
    definition:
      union:
        - method: fqn
          value: fct_weather_daily
          parents: true
        - method: fqn
          value: fct_trips_weather
        - exclude:
            - method: test_type
              value: unit
  
  - name: dbt-build
    definition:
      union:
        - method: path
          value: models
        - exclude: 
          - method: test_type
            value: unit

  
          