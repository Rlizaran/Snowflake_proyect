version: 2

sources:
  - name: snowflake_ia
    description: "Esquema que contiene las tablas y resultados generados por los modelos de Machine Learning y Forecasting nativos de Snowflake."
    tables:
      - name: pronostico_final
        description: "Tabla cruda generada mediante RESULT_SCAN tras ejecutar el CALL del modelo forecast_test. Contiene las predicciones por series de tiempo sin decodificar."
        columns:
          - name: SERIES
            description: "Llave compuesta de la serie temporal (Formato: CITY_ID|RIDEABLE_TYPE|USER_TYPE)."
          - name: TS
            description: "Timestamp de la fecha proyectada para el forecast."
          - name: FORECAST
            description: "Valor central predicho para la variable objetivo (N_TRIPS)."
          - name: LOWER_BOUND
            description: "Límite inferior del intervalo de confianza de la predicción."
          - name: UPPER_BOUND
            description: "Límite superior del intervalo de confianza de la predicción."