# Documentacion + tests sobre los snapshots SCD2.

version: 2

snapshots:
  - name: snp_NOAA__noaa_raw_year
    description: 'Snapshot SCD2 sobre noaa_raw_year. Strategy check sobre data_value y q_flag_category.'
    columns:
      - name: scd_key
        description: 'PK natural compuesta serializada: station_id || observation_date || element.'
        data_tests:
          - not_null
      - name: station_id
        data_tests:
          - not_null
      - name: observation_date
        data_tests:
          - not_null
      - name: element
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ['TMAX','TMIN','PRCP','SNOW','AWND','SNWD','WSF2','WSF5'] }
      - name: data_value
      - name: q_flag
      - name: q_flag_category
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }
      - name: obs_time
      - name: source_file
      - name: load_ts
      - name: dbt_scd_id
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: dbt_updated_at
      - name: dbt_valid_from
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: 'NULL = version vigente. NOT NULL = reemplazada.'
