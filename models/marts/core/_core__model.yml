# Capa Gold core: dims + fct_trips + fct_weather_daily. Contract enforced y constraints a nivel tabla.

version: 2

models:

  - name: dim_fecha
    description: 'Spine diario de fechas (date_spine). PK fecha_id establecida aqui, rango derivado de stg_NOAA.'
    columns:
      - name: fecha_id
        data_type: date
        data_tests:
          - unique
      - name: anio
        data_type: "number(4,0)"
      - name: trimestre
        data_type: "number(1,0)"
      - name: mes
        data_type: "number(1,0)"
      - name: nombre_mes
        data_type: varchar
      - name: anio_mes
        data_type: varchar
      - name: dia_mes
        data_type: "number(2,0)"
      - name: dia_semana
        data_type: "number(2,0)"
      - name: nombre_dia
        data_type: varchar
      - name: es_fin_semana
        data_type: boolean
      - name: semana_anio
        data_type: "number(2,0)"
      - name: dia_anio
        data_type: "number(3,0)"
      - name: estacion
        data_type: varchar

  - name: dim_city
    description: 'Ciudades CityBike (Manhattan, Jersey City). Passthrough de slv_city.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [city_id]
      - type: not_null
        columns: [city_id]
    columns:
      - name: city_id
        data_type: varchar
      - name: city
        data_type: varchar







