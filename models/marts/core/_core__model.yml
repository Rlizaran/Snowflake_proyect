# Capa Gold - core: dimensiones + fct_trips (table) + fct_weather_daily (view).
# Cambio v8: constraints solo a nivel tabla. dim_* y fct_weather_daily son views, sin constraints.
#           Anadido dim_quality_flag (passthrough de slv_quality_flag).

version: 2

models:
  - name: fct_trips
    description: 'Fact fino: 1 row por viaje, solo IDs + metricas (trip_duration_min, distance_in_km).'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ride_id]
      - type: not_null
        columns: [ride_id]
    columns:
      - name: ride_id
        data_type: varchar
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: trip_date
        data_type: date
        data_tests:
          - relationships:
              arguments: { to: ref('dim_fecha'), field: fecha_id }
      - name: city_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_city'), field: city_id }
      - name: rideable_type_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_rideable_bike'), field: rideable_type_code }
      - name: user_type_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_user_type'), field: user_type_code }
      - name: start_station_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station'), field: station_id }
      - name: end_station_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station'), field: station_id }
      - name: trip_duration_min
        data_type: "number(8, 2)"
      - name: distance_in_km
        data_type: float

  - name: fct_weather_daily
    description: 'Fact diario de clima por estacion (wide pivot). View, sin constraints.'
    columns:
      - name: daily_id
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: station_weather_id
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station_weather'), field: station_weather_id }
      - name: observation_date
        data_tests:
          - relationships:
              arguments: { to: ref('dim_fecha'), field: fecha_id }
      - name: city_id
      - name: temp_max_c
      - name: temp_min_c
      - name: temp_avg_c
      - name: precipitation_mm
      - name: snowfall_mm
      - name: snow_depth_mm
      - name: weather_category
        data_tests:
          - accepted_values:
              arguments: { values: ['rainy','snowy','hot','cold','mild'] }

  - name: dim_fecha
    description: 'Spine diario de fechas. Rango derivado de min/max de stg_NOAA__noaa_raw_year. View, sin constraints.'
    columns:
      - name: fecha_id
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: anio
      - name: trimestre
      - name: mes
      - name: nombre_mes
      - name: anio_mes
      - name: dia_mes
      - name: dia_semana
      - name: nombre_dia
      - name: es_fin_semana
      - name: semana_anio
      - name: dia_anio
      - name: estacion

  - name: dim_city
    description: 'Ciudades CityBike (Manhattan, Jersey City). Passthrough de slv_city. View, sin constraints.'
    columns:
      - name: city_id
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: city

  - name: dim_user_type
    description: 'Tipos de usuario CityBike. Passthrough de slv_user_type. View, sin constraints.'
    columns:
      - name: user_type_code
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: member_casual
      - name: description
      - name: is_subscriber

  - name: dim_rideable_bike
    description: 'Tipos de bicicleta CityBike. Passthrough de slv_rideable_type. View, sin constraints.'
    columns:
      - name: rideable_type_code
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: rideable_type
      - name: description
      - name: is_electric

  - name: dim_station
    description: 'Estaciones CityBike. Passthrough de slv_station. View, sin constraints.'
    columns:
      - name: station_id
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: canonical_name
      - name: canonical_lat
        description: 'Latitud redondeada de la estacion.'
      - name: canonical_lng
        description: 'Longitud redondeada de la estacion.'

  - name: dim_station_weather
    description: 'Estaciones NOAA del seed weather_station_us. Passthrough de slv_weather_station. View, sin constraints.'
    columns:
      - name: station_weather_id
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: city_id
      - name: station_name
      - name: lat
      - name: lng
      - name: state
      - name: elevation_m

  - name: dim_weather_element
    description: 'Elementos meteo NOAA GHCN-Daily. Passthrough de slv_weather_element. View, sin constraints.'
    columns:
      - name: element_code
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: description
      - name: unit

  - name: dim_quality_flag
    description: 'Lookup q_flag NOAA + q_flag_category. Passthrough de slv_quality_flag. View, sin constraints.'
    columns:
      - name: q_flag
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: q_flag_category
        data_tests:
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }
      - name: description
