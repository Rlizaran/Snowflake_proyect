# Capa Gold - core: dimensiones centrales. Tests minimos (las dims son passthrough de silver).

version: 2

models:
  - name: dim_fecha
    description: 'Spine diario de fechas. Rango derivado de min/max de stg_NOAA__noaa_raw_year.'
    columns:
      - name: fecha_id
        description: 'PK: fecha del dia.'
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null

  - name: dim_city
    description: 'Ciudades CityBike (Manhattan, Jersey City). Passthrough de slv_city.'
    columns:
      - name: city_id
        data_tests:
          - unique:  { config: { severity: error } }

  - name: dim_user_type
    description: 'Tipos de usuario CityBike. Passthrough de slv_user_type.'
    columns:
      - name: user_type_code
        data_tests:
          - unique:  { config: { severity: error } }

  - name: dim_rideable_bike
    description: 'Tipos de bicicleta CityBike. Passthrough de slv_rideable_type.'
    columns:
      - name: rideable_type_code
        data_tests:
          - unique:  { config: { severity: error } }

  - name: dim_station
    description: 'Estaciones CityBike. Passthrough de slv_station.'
    columns:
      - name: station_id
        data_tests:
          - unique:  { config: { severity: error } }

  - name: dim_station_weather
    description: 'Estaciones NOAA del seed weather_station_us. Passthrough de slv_weather_station.'
    columns:
      - name: station_weather_id
        data_tests:
          - unique:  { config: { severity: error } }

  - name: dim_weather_element
    description: 'Elementos meteo NOAA GHCN-Daily. Passthrough de slv_weather_element.'
    columns:
      - name: element_code
        data_tests:
          - unique:  { config: { severity: error } }
