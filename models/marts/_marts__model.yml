# Capa Gold marts: facts pre-calculados.
# Cambio v8: constraints solo a nivel tabla (fct_trips_daily, fct_trips_weather). Las views no llevan constraints.
#           fct_noaa_corrections (view): drop de m_flag, s_flag, q_flag_category. q_flag queda como FK a dim_quality_flag.

version: 2

models:
  - name: fct_trips_daily
    description: 'Fact agregado (trip_date x city x bike x user). Input para PBI y ML.FORECAST.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [daily_trip_id]
      - type: not_null
        columns: [daily_trip_id]
    columns:
      - name: daily_trip_id
        data_type: varchar
        data_tests:
          - unique: { config: { severity: error } }
      - name: trip_date
        data_type: date
        data_tests:
          - relationships:
              arguments: { to: ref('dim_fecha'), field: fecha_id }
      - name: city_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_city'), field: city_id }
      - name: rideable_type_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_rideable_bike'), field: rideable_type_code }
      - name: user_type_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_user_type'), field: user_type_code }
      - name: series_key
        data_type: varchar
      - name: n_trips
        data_type: "number(38, 0)"
      - name: avg_duration_min
        data_type: "number(38, 2)"
      - name: total_duration_min
        data_type: "number(38, 2)"
      - name: min_duration_min
        data_type: "number(38, 2)"
      - name: max_duration_min
        data_type: "number(38, 2)"
      - name: median_duration_min
        data_type: "number(38, 2)"
      - name: avg_distance_km
        data_type: "number(38, 2)"
      - name: total_distance_km
        data_type: float
      - name: min_distance_km
        data_type: float
      - name: max_distance_km
        data_type: float
      - name: median_distance_km
        data_type: "number(38, 2)"

  - name: fct_trips_weather
    description: 'Cruce diario rides + clima por ciudad. Grano = (trip_date x city).'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [trip_weather_id]
      - type: not_null
        columns: [trip_weather_id]
    columns:
      - name: trip_weather_id
        data_type: varchar
        data_tests:
          - unique: { config: { severity: error } }
      - name: trip_date
        data_type: date
        data_tests:
          - relationships:
              arguments: { to: ref('dim_fecha'), field: fecha_id }
      - name: city_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_city'), field: city_id }
      - name: station_weather_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station_weather'), field: station_weather_id }
      - name: n_trips
        data_type: "number(38, 0)"
      - name: n_trips_member
        data_type: "number(38, 0)"
      - name: n_trips_casual
        data_type: "number(38, 0)"
      - name: n_trips_classic
        data_type: "number(38, 0)"
      - name: n_trips_electric
        data_type: "number(38, 0)"
      - name: avg_duration_min
        data_type: "number(8, 2)"
      - name: avg_distance_km
        data_type: "number(8, 2)"
      - name: temp_max_c
        data_type: "number(8, 2)"
      - name: temp_min_c
        data_type: "number(8, 2)"
      - name: temp_avg_c
        data_type: "number(8, 2)"
      - name: precipitation_mm
        data_type: "number(8, 2)"
      - name: snowfall_mm
        data_type: "number(8, 2)"
      - name: snow_depth_mm
        data_type: "number(8, 2)"
      - name: weather_category
        data_type: varchar

  - name: fct_noaa_corrections
    description: 'SCD2 historico de observaciones NOAA (vigentes + reemplazadas). View, sin constraints.'
    columns:
      - name: observation_version_id
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: scd_key
        data_tests:
          - not_null
      - name: station_weather_id
        data_tests:
          - not_null
      - name: observation_date
      - name: element_code
        data_tests:
          - relationships:
              arguments: { to: ref('dim_weather_element'), field: element_code }
      - name: q_flag
        data_tests:
          - relationships:
              arguments: { to: ref('dim_quality_flag'), field: q_flag }
      - name: data_value
      - name: obs_time
      - name: dbt_valid_from
      - name: dbt_valid_to
      - name: dbt_updated_at
      - name: is_current
      - name: is_superseded
