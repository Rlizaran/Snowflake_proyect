# Capa Gold marts: facts pre-calculados con contract enforcement. Solo IDs + metricas.

version: 2

models:
  - name: fct_trips
    description: 'Fact fino: 1 row por viaje, solo IDs + metricas (trip_duration_min, distance_in_km).'
    config:
      contract: { enforced: true }
    columns:
      - name: ride_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique:  { config: { severity: error } }
      - name: trip_date
        data_type: date
        data_tests:
          - relationships:
              arguments: { to: ref('dim_fecha'), field: fecha_id }
      - name: city_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_city'), field: city_id }
      - name: rideable_type_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_rideable_bike'), field: rideable_type_code }
      - name: user_type_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_user_type'), field: user_type_code }
      - name: start_station_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station'), field: station_id }
      - name: end_station_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station'), field: station_id }
      - name: trip_duration_min
        data_type: number
      - name: distance_in_km
        data_type: float

  - name: fct_trips_daily
    description: 'Fact agregado (trip_date x city x bike x user). Input para PBI y ML.FORECAST.'
    config:
      contract: { enforced: true }
    columns:
      - name: daily_trip_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique:  { config: { severity: error } }
      - name: trip_date
        data_type: date
        data_tests:
          - relationships:
              arguments: { to: ref('dim_fecha'), field: fecha_id }
      - name: city_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_city'), field: city_id }
      - name: rideable_type_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_rideable_bike'), field: rideable_type_code }
      - name: user_type_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_user_type'), field: user_type_code }
      - name: series_key
        data_type: varchar
      - name: n_trips
        data_type: number
      - name: avg_duration_min
        data_type: number
      - name: total_duration_min
        data_type: number
      - name: min_duration_min
        data_type: number
      - name: max_duration_min
        data_type: number
      - name: median_duration_min
        data_type: number
      - name: avg_distance_km
        data_type: number
      - name: total_distance_km
        data_type: float
      - name: min_distance_km
        data_type: float
      - name: max_distance_km
        data_type: float
      - name: median_distance_km
        data_type: number

  - name: fct_trips_weather
    description: 'Cruce diario rides + clima por ciudad. Grano = (trip_date x city).'
    config:
      contract: { enforced: true }
    columns:
      - name: trip_weather_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique:  { config: { severity: error } }
      - name: trip_date
        data_type: date
        data_tests:
          - relationships:
              arguments: { to: ref('dim_fecha'), field: fecha_id }
      - name: city_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_city'), field: city_id }
      - name: station_weather_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station_weather'), field: station_weather_id }
      - name: n_trips
        data_type: number
      - name: n_trips_member
        data_type: number
      - name: n_trips_casual
        data_type: number
      - name: n_trips_classic
        data_type: number
      - name: n_trips_electric
        data_type: number
      - name: avg_duration_min
        data_type: number
      - name: avg_distance_km
        data_type: number
      - name: temp_max_c
        data_type: number
      - name: temp_min_c
        data_type: number
      - name: temp_avg_c
        data_type: number
      - name: precipitation_mm
        data_type: number
      - name: snowfall_mm
        data_type: number
      - name: snow_depth_mm
        data_type: number
      - name: weather_category
        data_type: varchar

  - name: fct_weather_daily
    description: 'Fact diario de clima por estacion (wide pivot).'
    config:
      contract: { enforced: true }
    columns:
      - name: daily_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique:  { config: { severity: error } }
      - name: station_weather_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station_weather'), field: station_weather_id }
      - name: observation_date
        data_type: date
        data_tests:
          - relationships:
              arguments: { to: ref('dim_fecha'), field: fecha_id }
      - name: city_id
        data_type: varchar
      - name: temp_max_c
        data_type: number
      - name: temp_min_c
        data_type: number
      - name: temp_avg_c
        data_type: number
      - name: precipitation_mm
        data_type: number
      - name: snowfall_mm
        data_type: number
      - name: snow_depth_mm
        data_type: number
      - name: weather_category
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: { values: ['rainy','snowy','hot','cold','mild'] }

  - name: fct_noaa_corrections
    description: 'SCD2 historico de observaciones NOAA (vigentes + reemplazadas).'
    config:
      contract: { enforced: true }
    columns:
      - name: observation_version_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique: { config: { severity: error } }
      - name: scd_key
        data_type: varchar
        constraints:
          - type: not_null
      - name: station_weather_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station_weather'), field: station_weather_id }
      - name: observation_date
        data_type: date
      - name: observation_year
        data_type: number
      - name: observation_quarter
        data_type: number
      - name: observation_month
        data_type: number
      - name: element_code
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_weather_element'), field: element_code }
      - name: data_value
        data_type: number
      - name: m_flag
        data_type: varchar
      - name: q_flag
        data_type: varchar
      - name: q_flag_category
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }
      - name: s_flag
        data_type: varchar
      - name: obs_time
        data_type: number
      - name: dbt_valid_from
        data_type: timestamp_ntz
      - name: dbt_valid_to
        data_type: timestamp_ntz
      - name: dbt_updated_at
        data_type: timestamp_ntz
      - name: is_current
        data_type: boolean
      - name: is_superseded
        data_type: boolean
      - name: is_problematic
        data_type: boolean
      - name: source_file
        data_type: varchar
      - name: load_ts
        data_type: timestamp_ntz
