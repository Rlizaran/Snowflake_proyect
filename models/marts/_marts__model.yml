# Capa Gold marts: facts pre-calculados para consumo Power BI.

version: 2

models:
  - name: fct_weather_daily
    description: 'Fact diario de clima por estacion (wide). 1 row por (station_id, observation_date).'
    columns:
      - name: daily_id
        description: 'PK surrogate MD5(station_id, observation_date).'
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: station_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_station_weather')
                field: station_id
      - name: observation_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      - name: city
        data_tests:
          - accepted_values: { arguments: { values: ['NY','JC'] } }
      - name: temp_max_c
      - name: temp_min_c
      - name: temp_avg_c
      - name: precipitation_mm
      - name: snowfall_mm
      - name: snow_depth_mm
      - name: weather_category
        data_tests:
          - accepted_values:
              arguments: { values: ['rainy','snowy','hot','cold','mild'] }

  - name: fct_noaa_corrections
    description: 'SCD2 historico de observaciones NOAA (vigentes + reemplazadas) para BI.'
    columns:
      - name: observation_version_id
        description: 'PK MD5(scd_key + dbt_valid_from).'
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: scd_key
        data_tests: [not_null]
      - name: station_id
      - name: observation_date
      - name: observation_year
      - name: observation_quarter
      - name: observation_month
      - name: element_code
      - name: data_value
      - name: m_flag
      - name: q_flag
      - name: s_flag
      - name: obs_time
      - name: dbt_valid_from
      - name: dbt_valid_to
      - name: dbt_updated_at
      - name: is_current
      - name: is_superseded
      - name: q_flag_category
        data_tests:
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }
      - name: is_problematic
