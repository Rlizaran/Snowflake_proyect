# Capa Gold marts: facts pre-calculados con contract enforced y constraints a nivel tabla.

version: 2

models:
  - name: fct_trips_daily
    description: 'Fact agregado (trip_date x city x bike x user). Input para PBI y ML.FORECAST.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [daily_trip_id]
      - type: not_null
        columns: [daily_trip_id]
    columns:
      - name: daily_trip_id
        data_type: varchar
        data_tests:
          - unique
      - name: trip_date
        data_type: date
      - name: city_id
        data_type: varchar
      - name: rideable_type_code
        data_type: varchar
      - name: user_type_code
        data_type: varchar
      - name: series_key
        data_type: varchar
      - name: n_trips
        data_type: "number(38, 0)"
      - name: avg_duration_min
        data_type: "number(38, 2)"
      - name: total_duration_min
        data_type: "number(38, 2)"
      - name: min_duration_min
        data_type: "number(38, 2)"
      - name: max_duration_min
        data_type: "number(38, 2)"
      - name: median_duration_min
        data_type: "number(38, 2)"
      - name: avg_distance_km
        data_type: "number(38, 2)"
      - name: total_distance_km
        data_type: float
      - name: min_distance_km
        data_type: float
      - name: max_distance_km
        data_type: float
      - name: median_distance_km
        data_type: "number(38, 2)"

  - name: fct_trips_weather
    description: 'Cruce diario rides + clima por ciudad. Grano = (trip_date x city). Join nuevo a nivel gold: city_id -> station_weather_id.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [trip_weather_id]
      - type: not_null
        columns: [trip_weather_id]
    columns:
      - name: trip_weather_id
        data_type: varchar
        data_tests:
          - unique
      - name: trip_date
        data_type: date
      - name: city_id
        data_type: varchar
      - name: station_weather_id
        description: 'FK a dim_station_weather. Join nuevo a nivel gold (no existe en silver), test aqui.'
        data_type: varchar
        data_tests:
          - relationships:
              arguments: { to: ref('dim_station_weather'), field: station_weather_id }
      - name: n_trips
        data_type: "number(38, 0)"
      - name: n_trips_member
        data_type: "number(38, 0)"
      - name: n_trips_casual
        data_type: "number(38, 0)"
      - name: n_trips_classic
        data_type: "number(38, 0)"
      - name: n_trips_electric
        data_type: "number(38, 0)"
      - name: avg_duration_min
        data_type: "number(8, 2)"
      - name: avg_distance_km
        data_type: "number(8, 2)"
      - name: temp_max_c
        data_type: "number(8, 2)"
      - name: temp_min_c
        data_type: "number(8, 2)"
      - name: temp_avg_c
        data_type: "number(8, 2)"
      - name: precipitation_mm
        data_type: "number(8, 2)"
      - name: snowfall_mm
        data_type: "number(8, 2)"
      - name: snow_depth_mm
        data_type: "number(8, 2)"
      - name: weather_category
        data_type: varchar

  - name: fct_noaa_corrections
    description: 'SCD2 historico de observaciones NOAA (vigentes + reemplazadas). PK surrogate generado aqui.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [observation_version_id]
      - type: not_null
        columns: [observation_version_id, scd_key, station_weather_id]
    columns:
      - name: observation_version_id
        data_type: varchar
        data_tests:
          - unique
      - name: scd_key
        data_type: varchar
      - name: station_weather_id
        data_type: varchar
      - name: observation_date
        data_type: date
      - name: observation_year
        data_type: "number(4, 0)"
      - name: observation_quarter
        data_type: "number(1, 0)"
      - name: observation_month
        data_type: "number(1, 0)"
      - name: element_code
        data_type: varchar
      - name: q_flag
        data_type: varchar
      - name: data_value
        data_type: "number(18, 2)"
      - name: obs_time
        data_type: "number(38, 0)"
      - name: dbt_valid_from
        data_type: timestamp_ntz
      - name: dbt_valid_to
        data_type: timestamp_ntz
      - name: dbt_updated_at
        data_type: timestamp_ntz
      - name: is_current
        data_type: boolean
      - name: is_superseded
        data_type: boolean
