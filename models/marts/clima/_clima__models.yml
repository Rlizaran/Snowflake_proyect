# Capa Gold marts/clima (schema CLIMA): facts NOAA + dims mono-dominio.

version: 2

models:

  - name: fct_weather_daily
    description: 'Fact diario de clima por estacion (pivot wide). PK surrogate y weather_category establecidos aqui.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [daily_id]
      - type: not_null
        columns: [daily_id]
    columns:
      - name: daily_id
        description: 'PK surrogate MD5(station_weather_id, observation_date).'
        data_type: varchar
        data_tests:
          - unique
      - name: station_weather_id
        description: 'FK a dim_station_weather.'
        data_type: varchar
      - name: observation_date
        description: 'Fecha de la observacion. FK a dim_fecha.'
        data_type: date
      - name: city_id
        description: 'Ciudad asociada a la station (solo poblada para stations del proyecto via city_weather_station_map).'
        data_type: varchar
      - name: temp_max_c
        description: 'Temperatura maxima del dia (Celsius).'
        data_type: "number(5, 2)"
      - name: temp_min_c
        description: 'Temperatura minima del dia (Celsius).'
        data_type: "number(5, 2)"
      - name: temp_avg_c
        description: 'Media aritmetica de temp_max_c y temp_min_c (Celsius), redondeada a 2 decimales.'
        data_type: "number(5, 2)"
      - name: precipitation_mm
        description: 'Precipitacion total del dia (mm). Elemento NOAA PRCP.'
        data_type: "number(8, 2)"
      - name: snowfall_mm
        description: 'Caida de nieve del dia (mm). Elemento NOAA SNOW.'
        data_type: "number(8, 2)"
      - name: snow_depth_mm
        description: 'Profundidad de nieve acumulada (mm). Elemento NOAA SNWD.'
        data_type: "number(8, 2)"
      - name: weather_category
        description: 'Clasificacion del dia con precedencia: rainy (precip > 5mm) > snowy (snow > 0) > hot (tmax > 25C) > cold (tmax < 5C) > mild. La primera condicion verdadera gana.'
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: { values: ['rainy','snowy','hot','cold','mild'] }

  - name: fct_noaa_corrections
    description: 'SCD2 historico de observaciones NOAA (vigentes + reemplazadas). PK surrogate generado aqui.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [observation_version_id]
      - type: not_null
        columns: [observation_version_id, scd_key, station_weather_id]
    columns:
      - name: observation_version_id
        description: 'PK surrogate MD5(scd_key, dbt_valid_from). Unica por version SCD2.'
        data_type: varchar
        data_tests:
          - unique
      - name: scd_key
        description: 'PK natural compuesta del SCD2: station_id || observation_date || element. Una fila por scd_key puede tener N versiones.'
        data_type: varchar
      - name: station_weather_id
        description: 'FK a dim_station_weather (renombrada de station_id en el snapshot).'
        data_type: varchar
      - name: observation_date
        description: 'Fecha de la observacion. FK a dim_fecha.'
        data_type: date
      - name: observation_year
        description: 'Anio de observation_date. Pre-calculado para evitar year() en queries de BI.'
        data_type: "number(4, 0)"
      - name: observation_quarter
        description: 'Trimestre 1-4 de observation_date.'
        data_type: "number(1, 0)"
      - name: observation_month
        description: 'Mes 1-12 de observation_date.'
        data_type: "number(2, 0)"
      - name: element_code
        description: 'FK a dim_weather_element (TMAX, TMIN, PRCP, ...).'
        data_type: varchar
      - name: q_flag
        description: 'FK a dim_quality_flag. La categoria se resuelve via join.'
        data_type: varchar
      - name: data_value
        description: 'Valor escalado a unidad real (Celsius / mm / m/s). Mismo valor que en el snapshot.'
        data_type: "number(18, 2)"
      - name: obs_time
        description: 'Hora de observacion HHMM (0000-2359). Sentinel 2400 = no reportado.'
        data_type: "number(38, 0)"
      - name: dbt_valid_from
        description: 'Timestamp en que esta version paso a vigente (heredado del snapshot SCD2).'
        data_type: timestamp_ntz
      - name: dbt_valid_to
        description: 'Timestamp en que esta version fue reemplazada. NULL si es la version vigente.'
        data_type: timestamp_ntz
      - name: dbt_updated_at
        description: 'Ultima vez que dbt toco la fila (INSERT o SET dbt_valid_to).'
        data_type: timestamp_ntz
      - name: is_current
        description: 'TRUE si dbt_valid_to IS NULL (version vigente). Listo para filtrar en BI.'
        data_type: boolean
      - name: is_superseded
        description: 'TRUE si dbt_valid_to IS NOT NULL (version reemplazada por una mas nueva). Util para medir cuantas correcciones publico NOAA.'
        data_type: boolean

  - name: dim_station_weather
    description: 'Estaciones NOAA del seed weather_station_us. Passthrough de slv_weather_station.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [station_weather_id]
      - type: not_null
        columns: [station_weather_id]
    columns:
      - name: station_weather_id
        description: 'PK de la station NOAA (formato USW#########).'
        data_type: varchar
      - name: city_id
        description: 'FK a dim_city. Solo poblada para stations mapeadas en city_weather_station_map (proyecto: 2 stations). NULL para el resto.'
        data_type: varchar
      - name: station_name
        description: 'Nombre legible de la station NOAA.'
        data_type: varchar
      - name: lat
        description: 'Latitud de la station.'
        data_type: float
      - name: lng
        description: 'Longitud de la station.'
        data_type: float
      - name: state
        description: 'Codigo de 2 letras del estado US (NY, NJ, ...).'
        data_type: varchar
      - name: elevation_m
        description: 'Elevacion sobre el nivel del mar, en metros.'
        data_type: float

  - name: dim_weather_element
    description: 'Elementos meteo NOAA GHCN-Daily. Passthrough de slv_weather_element.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [element_code]
      - type: not_null
        columns: [element_code]
    columns:
      - name: element_code
        description: 'PK del elemento (TMAX, TMIN, PRCP, SNOW, SNWD, AWND, WSF2, WSF5).'
        data_type: varchar
      - name: description
        description: 'Nombre legible del elemento (e.g. "Temperatura maxima del dia").'
        data_type: varchar
      - name: unit
        description: 'Unidad real del data_value asociado: celsius, mm o m/s.'
        data_type: varchar

  - name: dim_quality_flag
    description: 'Lookup q_flag NOAA + q_flag_category. Passthrough de slv_quality_flag.'
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [q_flag]
      - type: not_null
        columns: [q_flag]
    columns:
      - name: q_flag
        description: 'PK del q_flag (1 char). Vacio = OK.'
        data_type: varchar
      - name: q_flag_category
        description: 'Categoria de calidad (OK / SUSPECT / INVALID / PROCESSING / METADATA / UNKNOWN).'
        data_type: varchar
      - name: description
        description: 'Explicacion legible del q_flag (que check fallo o paso).'
        data_type: varchar

unit_tests:
  - name: test_fct_weather_daily_weather_category_classification
    description: >
      Valida la clasificacion de weather_category segun los thresholds del CASE WHEN:
      - PRCP > 5 -> rainy
      - SNOW > 0 (y prcp <= 5) -> snowy
      - TMAX > 25 -> hot
      - TMAX < 5 -> cold
      - resto -> mild
    model: fct_weather_daily
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('slv_weather_observation')
        rows:
          # rainy: prcp > 5
          - { observation_id: 'r-prcp', station_id: 'X', observation_date: '2024-01-01', element_code: 'PRCP', data_value: 10.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          - { observation_id: 'r-tmax', station_id: 'X', observation_date: '2024-01-01', element_code: 'TMAX', data_value: 20.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          - { observation_id: 'r-tmin', station_id: 'X', observation_date: '2024-01-01', element_code: 'TMIN', data_value: 10.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          # snowy: snow > 0 (prcp = 2, no rainy)
          - { observation_id: 's-snow', station_id: 'X', observation_date: '2024-01-02', element_code: 'SNOW', data_value:  3.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          - { observation_id: 's-prcp', station_id: 'X', observation_date: '2024-01-02', element_code: 'PRCP', data_value:  2.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          - { observation_id: 's-tmax', station_id: 'X', observation_date: '2024-01-02', element_code: 'TMAX', data_value: -1.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          - { observation_id: 's-tmin', station_id: 'X', observation_date: '2024-01-02', element_code: 'TMIN', data_value: -5.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          # hot: tmax > 25
          - { observation_id: 'h-tmax', station_id: 'X', observation_date: '2024-01-03', element_code: 'TMAX', data_value: 30.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          - { observation_id: 'h-tmin', station_id: 'X', observation_date: '2024-01-03', element_code: 'TMIN', data_value: 20.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          # cold: tmax < 5
          - { observation_id: 'c-tmax', station_id: 'X', observation_date: '2024-01-04', element_code: 'TMAX', data_value:  2.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          - { observation_id: 'c-tmin', station_id: 'X', observation_date: '2024-01-04', element_code: 'TMIN', data_value: -2.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          # mild: ninguna condicion previa
          - { observation_id: 'm-tmax', station_id: 'X', observation_date: '2024-01-05', element_code: 'TMAX', data_value: 18.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
          - { observation_id: 'm-tmin', station_id: 'X', observation_date: '2024-01-05', element_code: 'TMIN', data_value: 10.0, q_flag: '', source_file: 'unit', load_ts: '2024-01-01' }
      - input: ref('dim_station_weather')
        rows:
          - { station_weather_id: 'X', city_id: 'CITY_TEST' }
      - input: this
        rows: []
    expect:
      rows:
        - { observation_date: '2024-01-01', weather_category: 'rainy' }
        - { observation_date: '2024-01-02', weather_category: 'snowy' }
        - { observation_date: '2024-01-03', weather_category: 'hot' }
        - { observation_date: '2024-01-04', weather_category: 'cold' }
        - { observation_date: '2024-01-05', weather_category: 'mild' }
