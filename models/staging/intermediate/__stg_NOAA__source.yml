# Sources: tabla Bronze del schema NOAA en {DEV_,PRO_}CITYBIKE_BRONZE.

version: 2

sources:
  - name: NOAA
    database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_BRONZE"
    schema: NOAA
    description: 'Datos crudos NOAA GHCN-Daily by year (Manhattan + Newark/JC).'

    config:
      freshness:
        warn_after: {count: 30, period: day}
        error_after: {count: 40, period: day}
      loaded_at_field: load_ts

    tables:
      - name: noaa_raw_year
        description: 'Observaciones meteorologicas raw en formato long: una fila por (station, fecha, elemento).'
        columns:
          - name: station_id
            description: 'ID estacion meteorologica (USW00094728=Manhattan, USW00014734=Newark/JC).'
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: observation_date
            description: 'Fecha en formato YYYYMMDD (varchar bronze).'
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: element
            description: 'Codigo del elemento NOAA (TMAX, TMIN, PRCP, SNOW, etc.).'
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: data_value
            description: 'Valor de la observacion en decimas de unidad (segun NOAA codebook).'
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: m_flag
            data_type: varchar
          - name: q_flag
            description: 'Quality flag (no nulo = observacion sospechosa).'
            data_type: varchar
          - name: s_flag
            data_type: varchar
          - name: obs_time
            description: 'Hora de la observacion (HHMM, 4 digitos; default 2400 si NULL).'
            data_type: varchar
          - name: source_file
            data_type: varchar
          - name: load_ts
            data_type: timestamp_ntz
            data_tests:
              - not_null
