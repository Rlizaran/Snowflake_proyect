# Sources: tabla Bronze del schema NOAA en {DEV_,PRO_}CITYBIKE_BRONZE.
# Tests minimos: solo detectan fallos de ingesta. La validacion fina vive en el snapshot + stg.

version: 2

sources:
  - name: NOAA
    database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_BRONZE"
    schema: NOAA
    description: 'Datos crudos NOAA GHCN-Daily by year (Manhattan + Newark/JC).'

    config:
      freshness:
        warn_after: {count: 30, period: day}
        error_after: {count: 40, period: day}
      loaded_at_field: load_ts

    tables:
      - name: noaa_raw_year
        description: 'Observaciones meteorologicas raw en formato long (station, fecha, elemento).'
        columns:
          - name: station_id
            data_type: varchar
            data_tests:
              - not_null: { config: { severity: warn } }
          - name: observation_date
            data_type: varchar
          - name: element
            data_type: varchar
          - name: data_value
            data_type: varchar
          - name: m_flag
            data_type: varchar
          - name: q_flag
            data_type: varchar
          - name: s_flag
            data_type: varchar
          - name: obs_time
            data_type: varchar
          - name: source_file
            data_type: varchar
            data_tests:
              - not_null
          - name: load_ts
            data_type: timestamp_ntz
            data_tests:
              - not_null
