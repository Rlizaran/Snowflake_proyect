# Sources: tablas Bronze del schema CITYBIKE en {DEV_,PRO_}CITYBIKE_BRONZE.

version: 2

sources:
  - name: CityBike
    database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_BRONZE"
    schema: CITYBIKE
    description: 'Datos crudos de Citi Bike (NY + Jersey City) tal cual llegan de los CSV publicos.'

    config:
      freshness:
        warn_after: {count: 30, period: day}
        error_after: {count: 40, period: day}
      loaded_at_field: load_ts

    tables:
      - name: citybike_trips_jc
        description: 'Viajes raw de Jersey City (PUT semanal del script Python).'
        columns:
          - name: ride_id
            description: 'Identificador unico del viaje.'
            data_type: varchar
          - name: rideable_type
            data_type: varchar
          - name: started_at
            data_type: varchar
          - name: ended_at
            data_type: varchar
          - name: start_station_name
            data_type: varchar
          - name: start_station_id
            data_type: varchar
          - name: end_station_name
            data_type: varchar
          - name: end_station_id
            data_type: varchar
          - name: start_lat
            data_type: varchar
          - name: start_lng
            data_type: varchar
          - name: end_lat
            data_type: varchar
          - name: end_lng
            data_type: varchar
          - name: member_casual
            data_type: varchar
          - name: source_file
            data_type: varchar
            data_tests:
              - not_null
          - name: load_ts
            data_type: timestamp_ntz
            data_tests:
              - not_null

      - name: citybike_trips_ny
        description: 'Viajes raw de New York Manhattan (COPY semanal desde S3 publico).'
        columns:
          - name: ride_id
            description: 'Identificador unico del viaje.'
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
              - unique:      { config: { severity: warn } }
          - name: rideable_type
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: started_at
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: ended_at
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: start_station_name
            data_type: varchar
          - name: start_station_id
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: end_station_name
            data_type: varchar
          - name: end_station_id
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
          - name: start_lat
            data_type: varchar
          - name: start_lng
            data_type: varchar
          - name: end_lat
            data_type: varchar
          - name: end_lng
            data_type: varchar
          - name: member_casual
            data_type: varchar
            data_tests:
              - not_null:    { config: { severity: warn } }
              - accepted_values:
                  config: { severity: warn }
                  arguments: { values: ['member','casual'] }
          - name: source_file
            data_type: varchar
            data_tests:
              - not_null
          - name: load_ts
            data_type: timestamp_ntz
            data_tests:
              - not_null
