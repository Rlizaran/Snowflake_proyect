# Silver CityBike: stg incremental + dimensiones normalizadas + fact slv_trip.

version: 2

models:
  - name: stg_CityBike__citybike_trips
    description: 'Modelo incremental que unifica viajes de NY (Manhattan) y JC.'
    columns:
      - name: ride_id
        data_tests:
          - unique
          - not_null
      - name: city
        data_tests:
          - accepted_values:
              arguments: { values: ['Manhattan', 'Jersey City'] }
      - name: rideable_type
        data_tests:
          - accepted_values:
              arguments: { values: ['classic_bike', 'electric_bike'] }
      - name: member_casual
        data_tests:
          - accepted_values:
              arguments: { values: ['member', 'casual'] }
      - name: load_ts
        data_tests:
          - not_null

  - name: slv_trip
    description: 'Fact normalizado: un row por viaje (NY+JC), con FKs explicitas. distance_in_km NULLeado para round-trips y outliers > 500.'
    columns:
      - name: ride_id
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: trip_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      - name: rideable_type_code
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_rideable_type')
                field: rideable_type_code
      - name: user_type_code
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_user_type')
                field: user_type_code
      - name: start_station_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_station')
                field: station_id
      - name: end_station_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_station')
                field: station_id
      - name: city_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_city')
                field: city_id

  - name: slv_city
    description: 'Lookup de ciudades CityBike (Manhattan, Jersey City).'
    columns:
      - name: city_id
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: city
        data_tests:
          - unique
          - accepted_values:
              arguments: { values: ['Manhattan','Jersey City'] }

  - name: slv_rideable_type
    description: 'Lookup de tipos de bicicleta CityBike.'
    columns:
      - name: rideable_type_code
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: rideable_type
        data_tests:
          - unique
          - accepted_values:
              arguments: { values: ['classic_bike','electric_bike'] }

  - name: slv_user_type
    description: 'Lookup de tipos de usuario CityBike (member, casual).'
    columns:
      - name: user_type_code
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: member_casual
        data_tests:
          - unique
          - accepted_values:
              arguments: { values: ['casual','member'] }

  - name: slv_station
    description: 'Estaciones unicas (NY + JC) deducidas desde stg_CityBike__citybike_trips.'
    columns:
      - name: station_id
        data_tests:
          - unique
          - not_null
