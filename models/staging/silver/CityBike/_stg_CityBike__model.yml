version: 2

models:
  - name: stg_CityBike__citybike_trips
    description: >
      Modelo incremental que unifica los viajes de New York (NY) y Jersey City (JC).
    columns:
      - name: ride_id
        description: "Identificador único de cada viaje (Clave Primaria)."
        data_tests:
          - unique
          - not_null
      - name: city
        description: "Ciudad de origen: 'Manhattan' o 'Jersey City'."
        data_tests:
          - accepted_values:
              arguments: { values: ['Manhattan', 'Jersey City'] }
      - name: started_at
        description: "Timestamp de inicio del viaje. Filtrado para ser >= 2024-01-01."
        data_tests:
          - not_null
      - name: ended_at
        description: "Timestamp de fin del viaje. Validado para ser posterior a started_at."
        data_tests:
          - not_null
      - name: trip_duration_min
        description: "Duración calculada del viaje en minutos."
      - name: rideable_type
        description: "Tipo de bicicleta utilizada."
        data_tests:
          - accepted_values:
              arguments: { values: ['classic_bike', 'electric_bike'] }
      - name: start_station_id
        description: "ID de la estación de inicio. Validado contra nulos en la capa de limpieza."
        data_tests:
          - not_null
      - name: end_station_id
        description: "ID de la estación de destino. Validado contra nulos en la capa de limpieza."
        data_tests:
          - not_null
      - name: member_casual
        description: "Tipo de usuario (Suscrito o Casual)."
        data_tests:
          - accepted_values:
              arguments: { values: ['member', 'casual'] }
      - name: load_ts
        description: "Timestamp de carga desde el sistema origen. Se usa para la lógica incremental."
        data_tests:
          - not_null

  - name: slv_trip
    description: 'Fact normalizado: un row por viaje (NY+JC unidos), con FKs explicitas y atributos derivados (duracion, distancia)'
    columns:
      - name: ride_id
        description: 'PK natural del viaje (Citi Bike garantiza unicidad)'
        data_tests:
          - unique:
              config: { severity: error }
          - not_null:
              config: { severity: error }
      - name: trip_date
        description: 'FK a slv_date (date(started_at))'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_date')
                field: date_id
      - name: started_at
        data_tests: [not_null]
      - name: ended_at
      - name: trip_duration_min
        description: 'Minutos entre started_at y ended_at (derivado en stg)'
      - name: rideable_type_code
        description: 'FK a slv_rideable_type'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_rideable_type')
                field: rideable_type_code
      - name: user_type_code
        description: 'FK a slv_user_type'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_user_type')
                field: user_type_code
      - name: start_station_id
        description: 'FK a slv_station (origen del viaje)'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_station')
                field: station_id
      - name: end_station_id
        description: 'FK a slv_station (destino del viaje)'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_station')
                field: station_id        
      - name: city_id
        description: 'FK de slv_city'
        data_tests:
          - relationships:
              arguments: 
                to: ref('slv_city')
                field: city_id

  - name: slv_city
    description: 'Lookup de ciudades CityBike (NY, JC) con surrogate key.'
    columns:
      - name: city_id
        description: 'Surrogate key MD5(city)'
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: city
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
          - accepted_values: { arguments: { values: ['Manhattan','Jersey City'] } }

  - name: slv_rideable_type
    description: 'Lookup: tipos de bicicleta CityBike'
    columns:
      - name: rideable_type_code
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: rideable_type
        description: 'Type of bikes available'
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
          - accepted_values: { arguments: { values: ['classic_bike','electric_bike'] } }
      - name: description
      - name: is_electric

  - name: slv_user_type
    description: 'Lookup: tipos de usuario CityBike (member, casual)'
    columns:
      - name: user_type_code
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: member_casual
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
          - accepted_values: { arguments: { values: ['casual','member'] } }
      - name: description
      - name: is_subscriber

  - name: slv_date
    description: 'Fechas 2024-2026 con atributos calendario (anio, mes, dia, semana, estacion, etc.)'
    columns:
      - name: date_id
        description: 'PK: la fecha'
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: year
      - name: quarter
      - name: month
      - name: month_name
      - name: year_month
      - name: day_of_month
      - name: day_of_week
      - name: day_name
      - name: is_weekend
      - name: week_of_year
      - name: day_of_year
      - name: season

  - name: slv_station
    description: 'Estaciones unicas (NY + JC) deducidas desde stg_CityBike__citybike_trips'
    columns:
      - name: station_id
        description: 'PK de estaciones'
        data_tests:
          - unique
          - not_null
      - name: canonical_name
        description: 'Nombre canonico de la estacion (el mas frecuente por station_id)'
        data_type: varchar
      - name: canonical_lat
        description: 'Latitud canonica'
        data_type: number
      - name: canonical_lng
        description: 'Longitud canonica'
        data_type: number