# Silver NOAA: stg vigente del snapshot SCD2 + dim estaciones/elementos + fact observaciones.

version: 2

models:
  - name: stg_NOAA__noaa_raw_year
    description: 'View sobre snp_NOAA__noaa_raw_year. Solo version vigente (dbt_valid_to is null).'
    columns:
      - name: station_id
        data_tests:
          - not_null
      - name: observation_date
        data_tests:
          - not_null
      - name: element
        data_tests:
          - not_null
      - name: q_flag_category
        data_tests:
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }

  - name: slv_weather_observation
    description: 'Fact NOAA long format: una observacion por (station, date, element). Surrogate MD5.'
    columns:
      - name: observation_id
        description: 'PK surrogate MD5(station_id, observation_date, element_code).'
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: station_id
        description: 'FK a slv_weather_station (enforced por construccion: slv_weather_station = inner join seed con stg_NOAA distinct stations).'
      - name: observation_date
        description: 'FK a dim_fecha.'
        data_tests:
          - relationships:
              arguments:
                to:    ref('dim_fecha')
                field: fecha_id
      - name: element_code
        description: 'FK a slv_weather_element.'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_weather_element')
                field: element_code

  - name: slv_weather_station
    description: 'Dim de estaciones NOAA derivada del seed weather_station_us. Renombra city de las 2 estaciones del proyecto a Manhattan/Jersey City.'
    columns:
      - name: station_weather_id
        description: 'PK de estacion (renombrada del seed.station_id).'
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: city_id
        description: 'FK surrogate al slv_city (matchea solo para 2 estaciones del proyecto).'

  - name: slv_weather_element
    description: 'Lookup de elementos meteo NOAA GHCN-Daily.'
    columns:
      - name: element_code
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: unit
        data_tests:
          - accepted_values:
              arguments: { values: ['celsius','mm','m/s'] }
