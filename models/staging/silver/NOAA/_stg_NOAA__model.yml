# Silver NOAA: stg vigente + dim/lookup + fact observaciones.

version: 2

models:
  - name: stg_NOAA__noaa_raw_year
    description: 'View vigente sobre el snapshot SCD2 (dbt_valid_to is null).'
    columns:
      - name: station_id
        data_tests:
          - not_null
      - name: observation_date
        data_tests:
          - not_null
      - name: element
        data_tests:
          - not_null
      - name: q_flag
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_quality_flag')
                field: q_flag

  - name: slv_weather_observation
    description: 'Fact NOAA long format: una observacion por (station, date, element). Surrogate MD5 generado aqui.'
    columns:
      - name: observation_id
        description: 'PK surrogate MD5(station_id, observation_date, element_code).'
        data_tests:
          - unique
          - not_null
      - name: observation_date
        description: 'FK a dim_fecha.'
        data_tests:
          - relationships:
              arguments:
                to:    ref('dim_fecha')
                field: fecha_id
      - name: element_code
        description: 'FK a slv_weather_element.'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_weather_element')
                field: element_code

  - name: slv_weather_station
    description: 'Dim de estaciones NOAA derivada del seed. PK establecida aqui.'
    columns:
      - name: station_weather_id
        data_tests:
          - unique
          - not_null

  - name: slv_weather_element
    description: 'Lookup de elementos meteo NOAA GHCN-Daily. PK establecida aqui.'
    columns:
      - name: element_code
        data_tests:
          - unique
          - not_null
      - name: unit
        data_tests:
          - accepted_values:
              arguments: { values: ['celsius','mm','m/s'] }

  - name: slv_quality_flag
    description: 'Lookup normalizado de q_flag NOAA. PK y categoria establecidos aqui.'
    columns:
      - name: q_flag
        description: 'PK natural (codigo de un caracter publicado por NOAA, vacio == OK).'
        data_tests:
          - unique
          - not_null
      - name: q_flag_category
        data_tests:
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }
