# FIX (ronda 6): bajado a severity:warn el test relationships de
# slv_weather_observation.station_id -> slv_weather_station.
# Razon: el snapshot ya NO filtra por las 2 estaciones del proyecto (mantenemos todas las US
# disponibles para el futuro fct_us_temperature en Gold). slv_weather_station tiene solo 2
# estaciones hardcoded -> el test fallaria sistematicamente con error.
# Cuando se cree una dim ampliada (slv_weather_station_us con todas las del proyecto US-wide)
# se puede subir de nuevo a 'error'. O mantener como warn si la asimetria es intencional.

version: 2

models:
  - name: stg_NOAA__noaa_raw_year
    description: 'Vista delgada sobre snp_NOAA__noaa_raw_year. Solo version vigente (dbt_valid_to is null).'
    columns:
      - name: station_id
        data_tests:
          - not_null
      - name: observation_date
        data_tests:
          - not_null
      - name: element
        data_tests:
          - not_null
      - name: data_value
      - name: m_flag
      - name: q_flag
      - name: s_flag
      - name: obs_time
      - name: source_file
      - name: load_ts
      - name: dbt_valid_from
        description: 'Inicio de vigencia de esta version (SCD2)'
      - name: dbt_updated_at
        description: 'Ultimo refresh del snapshot que toco esta fila'

  - name: slv_weather_observation
    description: 'Fact NOAA en long format: una observacion por (station, date, element). Surrogate key MD5 sobre las 3 cols.'
    columns:
      - name: observation_id
        description: 'Surrogate PK (hash MD5 de station_id + observation_date + element_code)'
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: station_id
        description: 'Unique station id per city. join with slv_weather_station (filtra a las 2 estaciones del proyecto)'
        data_tests:
          # FIX: severity:warn porque slv_weather_station es subset (2 estaciones) del universo de observation
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('slv_weather_station')
                field: station_id
      - name: observation_date
        description: 'FK a slv_date'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to:    ref('slv_date')
                field: date_id
      - name: element_code
        description: 'FK a slv_weather_element'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_weather_element')
                field: element_code
      - name: data_value
      - name: q_flag

  - name: slv_weather_observation_history
    description: 'TODAS las versiones del snapshot NOAA (vigentes + reemplazadas). Para BI: cuantas correcciones hizo NOAA por anio/estacion/elemento.'
    columns:
      - name: observation_version_id
        description: 'PK del row historico (scd_key + dbt_valid_from)'
        data_tests:
          - unique: { config: { severity: error } }
          - not_null
      - name: scd_key
        description: 'Clave SCD2 (station_id|observation_date|element)'
        data_tests:
          - not_null
      - name: station_id
      - name: observation_date
      - name: observation_year
      - name: observation_quarter
      - name: observation_month
      - name: element_code
      - name: data_value
      - name: m_flag
      - name: q_flag
      - name: s_flag
      - name: obs_time
      - name: dbt_valid_from
      - name: dbt_valid_to
        description: 'NULL = version vigente. NOT NULL = reemplazada por una correccion.'
      - name: dbt_updated_at
      - name: is_current
      - name: is_superseded
        description: 'TRUE = esta version fue corregida por NOAA mas tarde (= "error" detectado)'
      - name: has_q_flag

  - name: slv_weather_daily
    description: 'Wide pivot pre-agregado: un row por (station_id, date) con TMAX/TMIN/PRCP/SNOW. Surrogate key.'
    columns:
      - name: daily_id
        description: 'Surrogate PK (hash MD5 de station_id + observation_date)'
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: station_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_weather_station')
                field: station_id
      - name: observation_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_date')
                field: date_id
      - name: city
      - name: temp_max_c
      - name: temp_min_c
      - name: temp_avg_c
      - name: precipitation_mm
      - name: snowfall_mm
      - name: snow_depth_mm
      - name: weather_category
        data_tests:
          - accepted_values:
              arguments: { values: ['rainy','snowy','hot','cold','mild'] }

  - name: slv_weather_station
    description: 'Dimension de estaciones meteorologicas NOAA del proyecto (Manhattan + Newark/JC). Subset del universo en slv_weather_observation.'
    columns:
      - name: station_id
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: station_name
      - name: city
        data_tests:
          - accepted_values: { arguments: { values: ['NY','JC'] } }
      - name: lat
      - name: lng
      - name: state
      - name: elevation_m

  - name: slv_weather_element
    description: 'Lookup: elementos meteorologicos NOAA GHCN-Daily (TMAX, TMIN, PRCP, etc.)'
    columns:
      - name: element_code
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: description
      - name: unit
        data_tests:
          - accepted_values:
              arguments: { values: ['celsius','mm','m/s'] }
