# Silver NOAA: stg vigente del snapshot SCD2 + dim estaciones/elementos + fact observaciones.

version: 2

models:
  - name: stg_NOAA__noaa_raw_year
    description: 'Vista delgada sobre snp_NOAA__noaa_raw_year. Solo version vigente (dbt_valid_to is null).'
    columns:
      - name: station_id
        data_tests:
          - not_null
      - name: observation_date
        data_tests:
          - not_null
      - name: element
        data_tests:
          - not_null
      - name: data_value
        description: 'Valor en unidad real (Celsius / mm / m/s). Escalado en snapshot.'
      - name: m_flag
      - name: q_flag
      - name: q_flag_category
        data_tests:
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }
      - name: s_flag
      - name: obs_time
      - name: source_file
      - name: load_ts
      - name: dbt_valid_from
      - name: dbt_updated_at

  - name: slv_weather_observation
    description: 'Fact NOAA long format: una observacion por (station, date, element). Surrogate MD5.'
    columns:
      - name: observation_id
        description: 'PK surrogate (MD5 de station_id + observation_date + element_code).'
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: station_id
        description: 'FK a slv_weather_station. severity:warn (slv_weather_station es subset).'
        data_tests:
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('slv_weather_station')
                field: station_id
      - name: observation_date
        description: 'FK a dim_fecha.'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to:    ref('dim_fecha')
                field: fecha_id
      - name: element_code
        description: 'FK a slv_weather_element.'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_weather_element')
                field: element_code
      - name: data_value
      - name: q_flag
      - name: q_flag_category
        data_tests:
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }

  - name: slv_weather_station
    description: 'Dimension de estaciones NOAA del proyecto (Manhattan + Newark/JC).'
    columns:
      - name: station_id
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: station_name
      - name: city
        data_tests:
          - accepted_values: { arguments: { values: ['Manhattan','Jersey City'] } }
      - name: lat
      - name: lng
      - name: state
      - name: elevation_m

  - name: slv_weather_element
    description: 'Lookup de elementos meteorologicos NOAA GHCN-Daily.'
    columns:
      - name: element_code
        data_tests:
          - unique:  { config: { severity: error } }
          - not_null
      - name: description
      - name: unit
        data_tests:
          - accepted_values:
              arguments: { values: ['celsius','mm','m/s'] }
