# Silver NOAA: stg vigente + dim/lookup + fact observaciones.

version: 2

models:
  - name: stg_NOAA__noaa_raw_year
    description: 'View vigente sobre el snapshot SCD2 (dbt_valid_to is null).'
    columns:
      - name: station_id
        description: 'PK de la station NOAA GHCN-Daily (formato USW#########).'
        data_tests:
          - not_null
      - name: observation_date
        description: 'Fecha de la observacion meteo. FK indirecta a dim_fecha (via slv_weather_observation).'
        data_tests:
          - not_null
      - name: element
        description: 'Codigo de elemento meteo (TMAX, TMIN, PRCP, SNOW, SNWD, AWND, WSF2, WSF5).'
        data_tests:
          - not_null
      - name: q_flag
        description: 'Quality flag NOAA (1 char). FK a slv_quality_flag para resolver categoria.'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_quality_flag')
                field: q_flag

  - name: slv_weather_observation
    description: 'Fact NOAA long format: una observacion por (station, date, element). Surrogate MD5 generado aqui.'
    columns:
      - name: observation_id
        description: 'PK surrogate MD5(station_id, observation_date, element_code).'
        data_tests:
          - unique
          - not_null
      - name: station_id
        description: 'FK a slv_weather_station / dim_station_weather.'
      - name: observation_date
        description: 'Fecha de la observacion. FK a dim_fecha.'
        data_tests:
          - relationships:
              arguments:
                to:    ref('dim_fecha')
                field: fecha_id
      - name: element_code
        description: 'Codigo del elemento meteo. FK a slv_weather_element.'
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_weather_element')
                field: element_code
      - name: q_flag
        description: 'Quality flag NOAA. FK a slv_quality_flag.'
      - name: data_value
        description: 'Valor medido en unidad real (Celsius para TMAX/TMIN, mm para PRCP/SNOW/SNWD, m/s para AWND/WSF2/WSF5). Escalado /10 desde decimas en snapshot.'
      - name: source_file
        description: 'Linaje: nombre del CSV NOAA de bronze que origino el row.'
      - name: load_ts
        description: 'Linaje: timestamp de carga a bronze.'

  - name: slv_weather_station
    description: 'Dim de estaciones NOAA derivada del seed. PK establecida aqui.'
    columns:
      - name: station_weather_id
        description: 'PK de la station NOAA (renombrada del seed.station_id).'
        data_tests:
          - unique
          - not_null
      - name: city_id
        description: 'FK surrogate a slv_city. Solo poblada para stations mapeadas en city_weather_station_map; NULL para el resto.'
      - name: station_name
        description: 'Nombre legible de la station NOAA.'
      - name: lat
        description: 'Latitud de la station.'
      - name: lng
        description: 'Longitud de la station.'
      - name: state
        description: 'Codigo de 2 letras del estado US (NY, NJ, ...).'
      - name: elevation_m
        description: 'Elevacion sobre el nivel del mar, en metros.'

  - name: slv_weather_element
    description: '{{ doc("weather_elements") }}'
    columns:
      - name: element_code
        description: 'PK del elemento (TMAX, TMIN, PRCP, SNOW, SNWD, AWND, WSF2, WSF5).'
        data_tests:
          - unique
          - not_null
      - name: description
        description: 'Nombre legible del elemento (e.g. "Temperatura maxima del dia").'
      - name: unit
        description: 'Unidad real del data_value: celsius, mm o m/s (segun elemento).'
        data_tests:
          - accepted_values:
              arguments: { values: ['celsius','mm','m/s'] }

  - name: slv_quality_flag
    description: '{{ doc("q_flag_codes") }}'
    columns:
      - name: q_flag
        description: 'PK natural: codigo de un caracter publicado por NOAA. Vacio ("") indica valor limpio (OK).'
        data_tests:
          - unique
          - not_null
      - name: q_flag_category
        description: 'Categoria de calidad: OK / SUSPECT / INVALID / PROCESSING / METADATA / UNKNOWN.'
        data_tests:
          - accepted_values:
              arguments: { values: ['OK','SUSPECT','INVALID','PROCESSING','METADATA','UNKNOWN'] }
      - name: description
        description: 'Explicacion legible del q_flag (que check fallo o paso).'
