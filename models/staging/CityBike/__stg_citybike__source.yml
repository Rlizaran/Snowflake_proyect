version: 2

# Sources: tablas Bronze del schema CITYBIKE en DB_CITYBIKE_BRONZE
sources:
  - name: CityBike
    database: DB_CITYBIKE_BRONZE
    schema: CITYBIKE
    description: 'Datos crudos de Citi Bike (NY + Jersey City) tal cual llegan de los CSV publicos'

    config:
      freshness:
        warn_after: {count: 30, period: day}
        error_after: {count: 40, period: day}
      loaded_at_field: load_ts

    tables:
      - name: citybike_trips_jc
        description: 'Viajes raw de Jersey City (PUT semanal del script Python)'
        columns:
          - name: ride_id
            description: 'Identificador unico del viaje'
            data_type: varchar
            data_tests:
              - not_null:
                  config:
                    severity: warn
          - name: rideable_type
            description: 'Tipo de bicicleta'
            data_type: varchar
          - name: started_at
            description: 'Timestamp de inicio del viaje (varchar bronze)'
            data_type: varchar
          - name: ended_at
            description: 'Timestamp de fin del viaje (varchar bronze)'
            data_type: varchar
          - name: start_station_name
            data_type: varchar
          - name: start_station_id
            data_type: varchar
          - name: end_station_name
            data_type: varchar
          - name: end_station_id
            data_type: varchar
          - name: start_lat
            data_type: varchar
          - name: start_lng
            data_type: varchar
          - name: end_lat
            data_type: varchar
          - name: end_lng
            data_type: varchar
          - name: member_casual
            description: 'Tipo de usuario'
            data_type: varchar
          - name: source_file
            description: 'Nombre del CSV de origen'
            data_type: varchar
          - name: load_ts
            description: 'Timestamp de carga a Snowflake'
            data_type: timestamp_ntz

      - name: citybike_trips_ny
        description: 'Viajes raw de New York Manhattan (COPY semanal desde S3 publico)'
        columns:
          - name: ride_id
            description: 'Identificador unico del viaje'
            data_type: varchar
            data_tests:
              - not_null:
                  config:
                    severity: warn
          - name: rideable_type
            description: 'Tipo de bicicleta'
            data_type: varchar
          - name: started_at
            data_type: varchar
          - name: ended_at
            data_type: varchar
          - name: start_station_name
            data_type: varchar
          - name: start_station_id
            data_type: varchar
          - name: end_station_name
            data_type: varchar
          - name: end_station_id
            data_type: varchar
          - name: start_lat
            data_type: varchar
          - name: start_lng
            data_type: varchar
          - name: end_lat
            data_type: varchar
          - name: end_lng
            data_type: varchar
          - name: member_casual
            data_type: varchar
          - name: source_file
            data_type: varchar
          - name: load_ts
            data_type: timestamp_ntz
