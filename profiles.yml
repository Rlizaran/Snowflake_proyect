# Profile dbt para Snowflake. Database segun DBT_ENVIRONMENTS (DEV / PRO).

snowflake_proyect:
  target: default
  outputs:
    default:
      type: snowflake
      account: "{{ env_var('SF_ACCOUNT') }}"
      user: "{{ env_var('SF_USER') }}"
      password: "{{ env_var('SF_PASSWORD') }}"
      role: "{{ env_var('SF_ROLE', 'ROLE_NYCBIKE') }}"
      warehouse: "{{ env_var('SF_WAREHOUSE', 'WH_NYCBIKE_DEV') }}"
      database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_SILVER"
      schema: "{{ env_var('SF_SCHEMA', 'CITYBIKE') }}"
      threads: 4
      client_session_keep_alive: false
