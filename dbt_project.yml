# ============================================================================
# dbt_project.yml - Pipeline medallion CityBike + NOAA en Snowflake
# FIX (ronda 6): removidos todos los +snowflake_warehouse: WH_ANALISIS overrides.
# Tras el primer dbt run completo, el resto son updates incrementales pequenios
# y el WH default (WH_NYCBIKE_DEV / WH_NYCBIKE_PRO) basta sin tardar mucho.
# ============================================================================
name: 'snowflake_proyect'
version: '1.0.0'
config-version: 2

profile: 'snowflake_proyect'

quoting:
  database: false
  schema: false
  identifier: false

# ----------------------------------------------------------------------------
# Rutas de archivos
# ----------------------------------------------------------------------------
model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ----------------------------------------------------------------------------
# Hooks a nivel de proyecto
# ----------------------------------------------------------------------------
#on-run-start:
#  - "ALTER WAREHOUSE WH_NYCBIKE_DEV RESUME IF SUSPENDED;"

# ============================================================================
# CONFIGURACION DE MODELOS
# ============================================================================
models:
  +transient: false
  snowflake_proyect:
    +snowflake_warehouse: >
      {%- if flags.FULL_REFRESH or flags.WHICH == 'build' -%}
        WH_ANALISIS
      {%- else -%}
        WH_NYCBIKE_DEV
      {%- endif -%}

    # ------------------------------------------------------------------------
    # STAGING - cast 1:1 desde Bronze (Capa Silver, schema intermediate)
    # ------------------------------------------------------------------------
    staging:
      +materialized: incremental
      +on_schema_change: append_new_columns
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_SILVER"
      intermediate:
        +schema: intermediate
        # FIX: removidos +snowflake_warehouse overrides para NY y JC. Usar WH default.

      # ----------------------------------------------------------------------
      # SILVER normalizado - slv_* con PKs/FKs explicitas
      # ----------------------------------------------------------------------
      silver:
        +materialized: view
        CityBike:
          +schema: CITYBIKE
        NOAA:
          +schema: NOAA

    # ------------------------------------------------------------------------
    # MARTS - Capa Gold (star schema para consumo Power BI)
    # ------------------------------------------------------------------------
    marts:
      +materialized: view
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_GOLD"
      +schema: MARTS

# ============================================================================
# CONFIGURACION DE SNAPSHOTS
# ============================================================================
snapshots:
  +transient: false
  +target_database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_SILVER"
  +target_schema: snapshots

# ============================================================================
# CONFIGURACION DE TESTS
# ============================================================================
tests:
  +store_failures: false
  +severity: error
