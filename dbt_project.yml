# Pipeline medallion CityBike + NOAA en Snowflake con dbt.

name: 'snowflake_proyect'
version: '1.0.0'
config-version: 2

# El profile debe coincidir con el definido en profiles.yml (en dbt Core) o
# con la conexión seleccionada en dbt Cloud.
profile: 'snowflake_proyect'

quoting:
  database: false
  schema: false
  identifier: false


# ----------------------------------------------------------------------------
# Rutas de archivos (no es necesario modificar a no ser que se renombren
# los directorios estándar)
# ----------------------------------------------------------------------------

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]


target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ============================================================================
# CONFIGURACIÓN DE MODELOS
# ============================================================================
models:
  +transient: false
  snowflake_proyect:
    +snowflake_warehouse: >
      {%- if env_var('DBT_ENVIRONMENTS', 'DEV') == 'PRO' -%}
        WH_NYCBIKE_PRO
      {%- elif flags.FULL_REFRESH or flags.WHICH == 'build' -%}
        WH_ANALISIS
      {%- else -%}
        WH_NYCBIKE_DEV
      {%- endif -%}

    staging:
      +materialized: incremental
      +on_schema_change: append_new_columns
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_SILVER"
      intermediate:
        +schema: intermediate
      silver:
        +materialized: table
        CityBike:
          +schema: CITYBIKE
        NOAA:
          +schema: NOAA

    marts:
      +materialized: view
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_GOLD"
      +schema: MARTS
      core:
        +schema: CORE
      bikes:
        +schema: MOBILITY
      clima:
        +schema: CLIMA
      analytics:
        +schema: ANALYTICS

    IA:
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_GOLD"
      +schema: IA
      +materialized: table

# ============================================================================
# CONFIGURACIÓN DE SEEDS
# ============================================================================
# Los seeds van a la base de datos BRONZE (son datos crudos cargados desde CSV).
seeds:
  +schema: seed_data
  +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_BRONZE"

  snowflake_proyect:
    weather_station_us:
      # Tipos de columna explícitos para evitar inferencias erróneas
      +column_types:
        station_id: VARCHAR(100)
        lat: FLOAT
        lng: FLOAT
        elevation_m: FLOAT
        state: VARCHAR(3)
        station_name: VARCHAR(100)
        city: VARCHAR(100)
    city_weather_station_map:
      +column_types:
        project_city: VARCHAR(100)
        station_weather_id: VARCHAR(100)

# ============================================================================
# CONFIGURACIÓN DE SNAPSHOTS
# ============================================================================
snapshots:
  +transient: false
  +target_database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_SILVER"
  +target_schema: snapshots
  +snowflake_warehouse: 'WH_ANALISIS'

# ============================================================================
# CONFIGURACIÓN DE TESTS
# ============================================================================
tests:
  +store_failures: false
  +severity: error
