# dbt project: transforma DB_CITYBIKE_BRONZE -> DB_CITYBIKE_SILVER (staging) -> DB_CITYBIKE_GOLD (marts)

name: 'snowflake_proyect'
version: '1.0.0'
config-version: 2

# Profile que dbt usara (definido en profiles.yml)
profile: 'default'

# Snowflake suele guardar identificadores en mayusculas; sin quoting evita conflictos
quoting:
  database: false
  schema: false
  identifier: false

# Rutas estandar de dbt; modelos en models/ se materializan segun la config de abajo
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


# Configuracion por capa de la arquitectura medallion
# - sources (Bronze) viven en DB_CITYBIKE_BRONZE.BRONZE y se declaran en models/staging/_sources.yml
# - staging (Silver) materializa tablas en DB_CITYBIKE_SILVER
# - marts (Gold) materializa vistas en DB_CITYBIKE_GOLD
models:
  snowflake_proyect:
    staging:
      +materialized: table
      citybike:
        +database: DB_CITYBIKE_SILVER
        +schema: CITYBIKE
      noaa:
        +database: DB_CITYBIKE_SILVER
        +schema: NOAA
    marts:
      +database: DB_CITYBIKE_GOLD
      +schema: MARTS
      +materialized: view