# dbt project: Bronze (sources) -> staging (cast 1:1) -> silver (normalizado, FKs) -> marts (Gold star schema)

name: 'snowflake_proyect'
version: '1.0.0'
config-version: 2

# Profile que dbt usara (debe coincidir con la llave en profiles.yml)
profile: 'snowflake_proyect'

# Snowflake guarda identificadores en mayusculas; sin quoting evita conflictos
quoting:
  database: false
  schema: false
  identifier: false

# Rutas estandar de dbt
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


# Configuracion por capa de la arquitectura medallion
# - sources (Bronze)        : DB_CITYBIKE_BRONZE.{CITYBIKE,NOAA}                          (raw VARCHAR)
# - staging (cast 1:1)      : models/staging/<dominio>/* -> DB_CITYBIKE_SILVER.{CITYBIKE,NOAA}
# - silver (normalizado)    : models/silver/<dominio>/*  -> DB_CITYBIKE_SILVER.{CITYBIKE,NOAA}  (PKs + FKs + slv_date)
# - marts (Gold)            : models/marts/*             -> DB_CITYBIKE_GOLD.MARTS              (star schema, agregaciones)
models:
  snowflake_proyect:

    staging:
      +materialized: table
      CityBike:
        +database: DB_CITYBIKE_SILVER
        +schema: CITYBIKE
        stg_CityBike__citybike_trips_ny:
          +snowflake_warehouse: WH_ANALISIS
      NOAA:
        +database: DB_CITYBIKE_SILVER
        +schema: NOAA
