# dbt project: transforma DB_CITYBIKE_BRONZE -> DB_CITYBIKE_SILVER (staging) -> DB_CITYBIKE_GOLD (marts)

name: 'snowflake_proyect'
version: '1.0.0'
config-version: 2

# Profile que dbt usara (debe coincidir con la llave de profiles.yml)
profile: 'snowflake_proyect'

# Snowflake guarda identificadores en mayusculas; sin quoting evita conflictos
quoting:
  database: false
  schema: false
  identifier: false

# Rutas estandar de dbt
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


# Configuracion por capa de la arquitectura medallion
# - sources (Bronze) viven en DB_CITYBIKE_BRONZE.{CITYBIKE,NOAA}
# - staging (Silver): models/staging/CityBike/* -> DB_CITYBIKE_SILVER.CITYBIKE
#                     models/staging/NOAA/*     -> DB_CITYBIKE_SILVER.NOAA
# - marts (Gold):     models/marts/*             -> DB_CITYBIKE_GOLD.MARTS
models:
  snowflake_proyect:
    staging:
      +materialized: table
      CityBike:
        +database: DB_CITYBIKE_SILVER
        +schema: CITYBIKE
        stg_CityBike__citybike_trips_ny:
          +snowflake_warehouse: WH_ANALISIS
      NOAA:
        +database: DB_CITYBIKE_SILVER
        +schema: NOAA
        +snowflake_warehouse: WH_ANALISIS
    marts:
      +database: DB_CITYBIKE_GOLD
      +schema: MARTS
      +materialized: view