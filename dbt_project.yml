# Pipeline medallion CityBike + NOAA en Snowflake con dbt.

name: 'snowflake_proyect'
version: '1.0.0'
config-version: 2

profile: 'snowflake_proyect'

quoting:
  database: false
  schema: false
  identifier: false

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  +transient: false
  snowflake_proyect:
    +snowflake_warehouse: >
      {%- if flags.FULL_REFRESH or flags.WHICH == 'build' -%}
        WH_ANALISIS
      {%- else -%}
        WH_NYCBIKE_DEV
      {%- endif -%}

    staging:
      +materialized: incremental
      +on_schema_change: append_new_columns
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_SILVER"
      intermediate:
        +schema: intermediate
      silver:
        +materialized: view
        CityBike:
          +schema: CITYBIKE
        NOAA:
          +schema: NOAA

    marts:
      +materialized: view
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_GOLD"
      +schema: MARTS
      core:
        +schema: CORE

snapshots:
  +transient: false
  +target_database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_CITYBIKE_SILVER"
  +target_schema: snapshots
  +snowflake_warehouse: 'WH_ANALISIS'

tests:
  +store_failures: false
  +severity: error
